<?xml version="1.0" encoding="UTF-8"?>
<!-- KENNY’S in Proza Libre, orange glass 3‑D, widened viewBox -->
<svg width="1200" height="320" viewBox="-40 0 1280 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Proza+Libre:wght@700&display=swap');
      .proza { font-family: 'Proza Libre', sans-serif; }
    ]]></style>

    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FFD7B0" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FF8C42" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="edgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE7CF"/>
      <stop offset="50%" stop-color="#FF9D46"/>
      <stop offset="100%" stop-color="#FFD8AF"/>
    </linearGradient>

    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glassFX" x="-60%" y="-50%" width="220%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="2" dy="2" result="offsetBlur"/>
      <feComposite in="offsetBlur" in2="SourceAlpha" operator="out" result="inner"/>
      <feGaussianBlur in="inner" stdDeviation="2" result="innerBlur"/>
      <feBlend in="SourceGraphic" in2="innerBlur" mode="normal"/>
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <text x="50%" y="72%" class="proza" font-size="220" font-weight="700" text-anchor="middle" fill="url(#edgeGrad)" stroke="url(#edgeGrad)" stroke-width="4" stroke-linejoin="round" opacity="0.25" transform="translate(8,8)">KENNY’S</text>
  <text x="50%" y="72%" class="proza" font-size="220" font-weight="700" text-anchor="middle" fill="url(#edgeGrad)" stroke="url(#edgeGrad)" stroke-width="4" stroke-linejoin="round" opacity="0.25" transform="translate(7,7)">KENNY’S</text>
  <text x="50%" y="72%" class="proza" font-size="220" font-weight="700" text-anchor="middle" fill="url(#edgeGrad)" stroke="url(#edgeGrad)" stroke-width="4" stroke-linejoin="round" opacity="0.25" transform="translate(6,6)">KENNY’S</text>
  <text x="50%" y="72%" class="proza" font-size="220" font-weight="700" text-anchor="middle" fill="url(#edgeGrad)" stroke="url(#edgeGrad)" stroke-width="4" stroke-linejoin="round" opacity="0.25" transform="translate(5,5)">KENNY’S</text>
  <text x="50%" y="72%" class="proza" font-size="220" font-weight="700" text-anchor="middle" fill="url(#edgeGrad)" stroke="url(#edgeGrad)" stroke-width="4" stroke-linejoin="round" opacity="0.25" transform="translate(4,4)">KENNY’S</text>
  <text x="50%" y="72%" class="proza" font-size="220" font-weight="700" text-anchor="middle" fill="url(#edgeGrad)" stroke="url(#edgeGrad)" stroke-width="4" stroke-linejoin="round" opacity="0.25" transform="translate(3,3)">KENNY’S</text>
  <text x="50%" y="72%" class="proza" font-size="220" font-weight="700" text-anchor="middle" fill="url(#edgeGrad)" stroke="url(#edgeGrad)" stroke-width="4" stroke-linejoin="round" opacity="0.25" transform="translate(2,2)">KENNY’S</text>
  <text x="50%" y="72%" class="proza" font-size="220" font-weight="700" text-anchor="middle" fill="url(#edgeGrad)" stroke="url(#edgeGrad)" stroke-width="4" stroke-linejoin="round" opacity="0.25" transform="translate(1,1)">KENNY’S</text>
  <text x="50%" y="72%" class="proza" font-size="220" font-weight="700" text-anchor="middle"
        fill="url(#glassFill)" stroke="url(#edgeGrad)" stroke-width="5" stroke-linejoin="round"
        filter="url(#glassFX)">KENNY’S</text>

  <text x="50%" y="72%" class="proza" font-size="220" font-weight="700" text-anchor="middle"
        fill="url(#shineGrad)" opacity="0.4">KENNY’S</text>
</svg>
